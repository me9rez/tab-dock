<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <style>
    :root {
      color-scheme: light dark;
      --bg: #fbfafc;
      --fg: #1d1b23;
      --muted: #716d80;
      --faint: #a5a1b3;
      --line: #e7e4ee;
      --code-bg: #f1eff6;
      --ok: #1f9d61;
      --bad: #d64545;
      --hover: #f3f1f8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #17161c;
        --fg: #e9e7f0;
        --muted: #918da3;
        --faint: #67637a;
        --line: #2a2833;
        --code-bg: #201e28;
        --ok: #3ecf8e;
        --bad: #f47174;
        --hover: #201e28;
      }
    }
    * { box-sizing: border-box; }

    body {
      width: 296px;
      margin: 0;
      padding: 12px 14px 10px;
      background: var(--bg);
      color: var(--fg);
      font: 13px/1.45 system-ui, "Segoe UI", "Microsoft YaHei UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* ---- 标题行：状态点 + 名字，右侧连接状态 ---- */
    header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-bottom: 9px;
      border-bottom: 1px solid var(--line);
    }
    header h1 {
      margin: 0;
      font-size: 12.5px;
      font-weight: 650;
      letter-spacing: .1px;
      color: var(--fg);
    }
    #conn {
      margin-left: auto;
      font-size: 12px;
      color: var(--muted);
    }
    #conn.on { color: var(--ok); }
    #conn.off { color: var(--bad); }

    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      flex: none;
      background: var(--bad);
    }
    .dot.on {
      background: var(--ok);
      animation: breathe 2.4s ease-in-out infinite;
    }
    @keyframes breathe {
      0%, 100% { opacity: 1; }
      50% { opacity: .45; }
    }

    /* ---- 数据区：纯排版，不用卡片 ---- */
    dl {
      margin: 0;
      padding: 8px 0;
    }
    dl > div {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      padding: 4.5px 0;
    }
    dt { color: var(--muted); font-size: 12px; }
    dd {
      margin: 0;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }
    dd code {
      font: 11.5px/1.4 ui-monospace, "Cascadia Mono", Consolas, monospace;
      color: var(--muted);
    }

    /* ---- 可点击的行（复制 GitHub 项目） ---- */
    dl .pick {
      cursor: pointer;
      margin: 0 -6px;
      padding: 4.5px 6px;
      border-radius: 5px;
    }
    dl .pick:hover { background: var(--hover); }
    .copied-ok {
      display: none;
      font-size: 10.5px;
      color: var(--ok);
      margin-left: 6px;
    }
    .pick.copied .copied-ok { display: inline; }

    /* ---- 批次收藏 ---- */
    #batchSec {
      padding: 8px 0 2px;
      border-top: 1px solid var(--line);
    }
    .sec-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .sec-title {
      font-size: 11px;
      color: var(--faint);
      letter-spacing: .5px;
    }
    .mini-btn {
      border: 0;
      background: none;
      color: var(--muted);
      font: inherit;
      font-size: 11.5px;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .mini-btn:hover { color: var(--fg); background: var(--hover); }
    .opt {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-left: auto;
      margin-right: 8px;
      cursor: pointer;
      color: var(--muted);
      font-size: 11.5px;
      user-select: none;
    }
    .opt:hover { color: var(--fg); }
    .opt input { display: none; }
    .opt .sw {
      width: 20px; height: 11px;
      border-radius: 6px;
      background: var(--line);
      position: relative;
      flex: none;
      transition: background .15s;
    }
    .opt .sw::after {
      content: '';
      position: absolute;
      top: 1.5px; left: 1.5px;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 2px #0004;
      transition: left .15s;
    }
    .opt input:checked + .sw { background: var(--ok); }
    .opt input:checked + .sw::after { left: 10.5px; }

    /* ---- 细滚动条（批次列表 / 整页溢出共用） ---- */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb {
      background: var(--line);
      background-clip: padding-box;
      border: 2px solid transparent;
      border-radius: 8px;
    }
    ::-webkit-scrollbar-thumb:hover { background: var(--faint); background-clip: padding-box; }
    ::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: transparent; }
    #batchList {
      max-height: 126px;   /* 约 3 行，多了滚动 */
      overflow-y: auto;
      margin-top: 2px;
    }
    .batch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 4px 6px;
      margin: 0 -6px;
      border-radius: 5px;
      cursor: pointer;
    }
    .batch-row:hover { background: var(--hover); }
    .b-name { font-size: 12px; font-variant-numeric: tabular-nums; }
    .b-meta { font-size: 10.5px; color: var(--faint); }
    .batch-row .del {
      opacity: 0;          /* 悬停才出现，平时安静 */
      padding: 0 5px;
      font-size: 13px;
      line-height: 1.4;
    }
    .batch-row:hover .del { opacity: 1; }
    #batchEmpty {
      font-size: 11px;
      color: var(--faint);
      padding: 6px 0 2px;
      display: none;
    }

    /* ---- 底部：curl 复制块 + 文字按钮 ---- */
    footer {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-top: 9px;
      border-top: 1px solid var(--line);
    }
    #copyline {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 8px;
      background: var(--code-bg);
      border-radius: 5px;
      cursor: pointer;
      user-select: none;
    }
    #copyline:hover { filter: brightness(.97); }
    @media (prefers-color-scheme: dark) { #copyline:hover { filter: brightness(1.18); } }
    #copyline .prompt { color: var(--faint); font: 11.5px ui-monospace, Consolas, monospace; flex: none; }
    #cmd {
      font: 11.5px/1.4 ui-monospace, "Cascadia Mono", Consolas, monospace;
      color: var(--fg);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #copyline .done {
      flex: none;
      font-size: 10.5px;
      color: var(--ok);
      display: none;
    }
    #copyline.copied .done { display: inline; }

    #reconnect {
      flex: none;
      padding: 5px 4px;
      border: 0;
      background: none;
      color: var(--muted);
      font: inherit;
      font-size: 12px;
      cursor: pointer;
      border-radius: 4px;
    }
    #reconnect:hover { color: var(--fg); background: var(--hover); }

    .err {
      color: var(--bad);
      font-size: 11.5px;
      padding-top: 6px;
      word-break: break-all;
      display: none;
    }
    .err.show { display: block; }
  </style>
</head>
<body>
  <header>
    <span id="dot" class="dot"></span>
    <h1>TabBridge</h1>
    <span id="conn">检测中…</span>
  </header>

  <dl>
    <div>
      <dt>标签页 / 窗口</dt>
      <dd id="counts">—</dd>
    </div>
    <div id="copyrepos" class="pick" title="复制所有 GitHub 仓库 + 提示词，可直接粘贴给 agent">
      <dt>GitHub 项目</dt>
      <dd><span id="repoCount">…</span><span class="copied-ok">已复制</span></dd>
    </div>
    <div>
      <dt>浏览器</dt>
      <dd id="browser">—</dd>
    </div>
    <div>
      <dt>桥地址</dt>
      <dd><code id="wsurl">—</code></dd>
    </div>
  </dl>

  <section id="batchSec">
    <div class="sec-head">
      <span class="sec-title">收藏批次</span>
      <label class="opt" title="收藏后关闭刚收藏的那些标签页">
        <input type="checkbox" id="closeAfterSave" />
        <span class="sw"></span>收后关闭
      </label>
      <button id="saveBatch" class="mini-btn">＋ 收藏当前</button>
    </div>
    <div id="batchList"></div>
    <div id="batchEmpty">还没有收藏——点上方「＋ 收藏当前」把这批 GitHub 项目存下来</div>
  </section>

  <div id="err" class="err"></div>

  <footer>
    <span id="copyline" title="点击复制">
      <span class="prompt">$</span><span id="cmd">curl 127.0.0.1:17890/tabs</span><span class="done">已复制</span>
    </span>
    <button id="reconnect">重新连接</button>
  </footer>

  <script>
// ===== 预览 mock：收藏 → 关闭 → 恢复 全闭环可点 =====
const MOCK_BATCHES = [
  { id: 1, name: '11-07 10:48', at: Date.now(), repos: [
      'https://github.com/Fei2411/DS-Bot/releases',
      'https://github.com/vercel-labs/scriptc/pull/42',
      'https://github.com/Niko1221/Strata/issues/12',
      'https://github.com/egoist/mygo',
      'https://github.com/milind-soni/OpenMausBot?tab=readme-ov-file',
      'https://github.com/dsh-tauri/deepseek-harness-desktop',
  ]},
];
const MOCK_TABS = [
  { id: 1, url: 'https://github.com/Fei2411/DS-Bot/releases' },
  { id: 2, url: 'https://github.com/vercel-labs/scriptc/pull/42' },
  { id: 3, url: 'https://github.com/Niko1221/Strata/issues/12' },
  { id: 4, url: 'https://github.com/egoist/mygo' },
  { id: 5, url: 'https://github.com/milind-soni/OpenMausBot?tab=readme-ov-file' },
  { id: 6, url: 'https://github.com/dsh-tauri/deepseek-harness-desktop' },
  { id: 7, url: 'https://github.com/feed' },
];
window.chrome = {
  runtime: { sendMessage: (msg, cb) => cb({
    connected: true, wsUrl: 'ws://127.0.0.1:17890/ws', browser: 'edge',
    tabCount: 16, windowCount: 1, extVersion: '1.0.0'
  })},
  storage: { local: {
    _d: { batches: MOCK_BATCHES, closeAfterSave: true },
    get: async (k) => ({ [k]: window.chrome.storage.local._d[k] }),
    set: async (o) => Object.assign(window.chrome.storage.local._d, o),
  }},
  tabs: {
    query: async () => MOCK_TABS,
    create: (o) => { MOCK_TABS.push({ id: Math.random(), url: o.url }); console.log('[mock] 新开:', o.url); },
    remove: (ids) => {
      for (const id of [].concat(ids)) {
        const i = MOCK_TABS.findIndex((t) => t.id === id);
        if (i >= 0) { console.log('[mock] 关闭:', MOCK_TABS[i].url); MOCK_TABS.splice(i, 1); }
      }
    },
  },
};
</script>
<script src="extension/popup.js"></script>
</body>
</html>
